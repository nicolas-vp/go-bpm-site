# Сборка и выкладка сайта go-bpm.tech.
#
# Документация берётся из репозитория go-bpm на сборке, поэтому сайт пересобирается не только на push сюда, но и
# по расписанию (раз в сутки), вручную и по repository_dispatch "go-bpm-docs" - его может слать CI go-bpm после
# изменений в docs/ (нужен токен с правом на этот репозиторий).
#
# Секреты: DEPLOY_HOST, DEPLOY_SSH_KEY (ключ, которому на сервере разрешён только /opt/go-bpm-site/deploy.sh),
# DEPLOY_KNOWN_HOSTS.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [go-bpm-docs]
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nicolas-vp/go-bpm
          path: go-bpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: build
        run: go run ./cmd/build -docs go-bpm/docs -out dist -commit "$(git -C go-bpm rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      # аргумент - метка релиза на сервере: 7 знаков коммита сайта
      - name: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: tar -czf - -C dist . | ssh -o BatchMode=yes "root@$DEPLOY_HOST" "${GITHUB_SHA::7}"
