# nginx: сайт go-bpm.tech и прокси к демо go-bpm. На сервере - /etc/nginx/conf.d/go-bpm.tech.conf
# (conf.d подключается в http{}). После правки: nginx -t && systemctl reload nginx.
#
# HTTPS - сертификат Let's Encrypt (certbot webroot, /var/www/acme), продлевает certbot.timer, после продления nginx
# перечитывает его хуком /etc/letsencrypt/renewal-hooks/deploy/reload-nginx. HTTP и www перенаправляются на
# https://go-bpm.tech.
#
# Сайт - статика из /var/www/go-bpm.tech/current (симлинк на последний релиз, его переключает deploy.sh).
# /api/ и /ui/ - демо на 127.0.0.1:8080. Авторизации у демо нет, поэтому наружу только GET и POST,
# запись (запуск процессов, действия с задачами) - с лимитом по IP, тело запроса - не больше 16 КБ.
# Консоль и API демо - не для поиска: X-Robots-Tag noindex (add_header в location отменяет заголовки server,
# поэтому общие повторены).

# запросы на запись: ключ только у POST, остальные лимитом записи не считаются
map $request_method $go_bpm_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=go_bpm_read:10m rate=10r/s;
limit_req_zone $go_bpm_write_key zone=go_bpm_write:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name go-bpm.tech www.go-bpm.tech;

    # проверка домена для сертификата Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://go-bpm.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.go-bpm.tech;
    include /etc/nginx/go-bpm-tls.inc;
    return 301 https://go-bpm.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name go-bpm.tech;
    include /etc/nginx/go-bpm-tls.inc;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/go-bpm.tech/current;
    index index.html;
    error_page 404 /404.html;

    access_log /var/log/nginx/go-bpm.tech.access.log;
    error_log /var/log/nginx/go-bpm.tech.error.log;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /static/ {
        expires 1h;
    }

    location /docs/images/ {
        expires 1d;
    }

    # Сборки моделера go-bpm (github.com/nicolas-vp/go-bpm-modeler) - вне релизов сайта: выкладка сайта переключает
    # current и не должна их терять. Публикует CI моделера через /opt/go-bpm-modeler/publish.sh, список читает
    # страница /modeler/ из /downloads/modeler/index.json. Имена архивов в каналах dev и latest не меняются между
    # сборками, поэтому no-cache: браузер перепроверяет файл по ETag
    location /downloads/ {
        alias /var/www/go-bpm-downloads/;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        limit_except GET HEAD POST { deny all; }
        limit_req zone=go_bpm_read burst=40 nodelay;
        limit_req zone=go_bpm_write burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        include /etc/nginx/go-bpm-proxy.inc;
    }

    location = /ui {
        return 301 /ui/;
    }

    location /ui/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        limit_except GET HEAD { deny all; }
        limit_req zone=go_bpm_read burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/go-bpm-proxy.inc;
    }
}
