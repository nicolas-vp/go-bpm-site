<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" width="960" height="222" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6b7680"/>
    </marker>
  </defs>
  <rect width="960" height="222" fill="#ffffff"/>

  <g transform="translate(0,-24)">
  <!-- шаги цикла -->
  <rect x="20" y="40" width="160" height="78" rx="12" fill="#f2f3ef" stroke="#cfd3cb" stroke-width="2"/>
  <text x="100" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#15212b">Схема BPMN/DMN</text>
  <text x="100" y="92" text-anchor="middle" font-size="12" fill="#6b7680">нарисовать</text>
  <text x="100" y="108" text-anchor="middle" font-size="12" fill="#6b7680">или поправить</text>

  <rect x="210" y="40" width="160" height="78" rx="12" fill="#f2f3ef" stroke="#cfd3cb" stroke-width="2"/>
  <text x="290" y="70" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="600" fill="#15212b">go generate</text>
  <text x="290" y="92" text-anchor="middle" font-size="12" fill="#6b7680">код и заготовки,</text>
  <text x="290" y="108" text-anchor="middle" font-size="12" fill="#6b7680">ошибки схемы сразу</text>

  <rect x="400" y="40" width="160" height="78" rx="12" fill="#f2f3ef" stroke="#cfd3cb" stroke-width="2"/>
  <text x="480" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#15212b">Go-код</text>
  <text x="480" y="92" text-anchor="middle" font-size="12" fill="#6b7680">методы, обработчики,</text>
  <text x="480" y="108" text-anchor="middle" font-size="12" fill="#6b7680">модель данных</text>

  <rect x="590" y="40" width="160" height="78" rx="12" fill="#f2f3ef" stroke="#cfd3cb" stroke-width="2"/>
  <text x="670" y="70" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="600" fill="#15212b">go test</text>
  <text x="670" y="92" text-anchor="middle" font-size="12" fill="#6b7680">юнит и e2e</text>
  <text x="670" y="108" text-anchor="middle" font-size="12" fill="#6b7680">на PostgreSQL</text>

  <rect x="780" y="40" width="160" height="78" rx="12" fill="#e2f2f6" stroke="#0b7896" stroke-width="2"/>
  <text x="860" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#0b7896">Деплой</text>
  <text x="860" y="92" text-anchor="middle" font-size="12" fill="#44515c">один сервис,</text>
  <text x="860" y="108" text-anchor="middle" font-size="12" fill="#44515c">обычный CI</text>

  <path d="M182 79h25" stroke="#6b7680" stroke-width="2" marker-end="url(#a)"/>
  <path d="M372 79h25" stroke="#6b7680" stroke-width="2" marker-end="url(#a)"/>
  <path d="M562 79h25" stroke="#6b7680" stroke-width="2" marker-end="url(#a)"/>
  <path d="M752 79h25" stroke="#6b7680" stroke-width="2" marker-end="url(#a)"/>

  <!-- обратная связь -->
  <path d="M860 120v40q0 14-14 14H114q-14 0-14-14v-38" fill="none" stroke="#e0912f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="480" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#a8650b">проверили результат — переделали — снова в цикл</text>

  </g>
  <!-- кто работает -->
  <text x="480" y="206" text-anchor="middle" font-size="14" fill="#44515c">В цикле работают <tspan font-weight="600" fill="#15212b">аналитик и разработчик</tspan> — или <tspan font-weight="600" fill="#0b7896">ИИ-агент</tspan>: всё — текст в репозитории, проверка — команды.</text>
</svg>
