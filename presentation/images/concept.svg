<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7680"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#15212b"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>

  <!-- 1. Моделирование -->
  <rect x="20" y="40" width="200" height="200" rx="14" fill="#f2f3ef" stroke="#cfd3cb" stroke-width="2"/>
  <text x="120" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#15212b">1. Схема</text>
  <circle cx="58" cy="122" r="11" fill="#fff" stroke="#15212b" stroke-width="2"/>
  <path d="M69 122h18" stroke="#15212b" stroke-width="1.6" marker-end="url(#s)"/>
  <rect x="89" y="106" width="46" height="32" rx="6" fill="#fff" stroke="#15212b" stroke-width="2"/>
  <path d="M135 122h14" stroke="#15212b" stroke-width="1.6" marker-end="url(#s)"/>
  <path d="M164 108l15 14-15 14-15-14z" fill="#fff" stroke="#15212b" stroke-width="2"/>
  <path d="M179 122h12" stroke="#15212b" stroke-width="2"/>
  <circle cx="198" cy="122" r="7" fill="#fff" stroke="#15212b" stroke-width="4"/>
  <text x="120" y="176" text-anchor="middle" font-size="14" fill="#15212b">BPMN и DMN</text>
  <text x="120" y="196" text-anchor="middle" font-size="14" fill="#15212b">в Camunda Modeler</text>
  <text x="120" y="222" text-anchor="middle" font-size="12" fill="#6b7680">аналитик + разработчик</text>

  <path d="M222 140h44" stroke="#6b7680" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 2. Генерация -->
  <rect x="270" y="40" width="200" height="200" rx="14" fill="#f2f3ef" stroke="#cfd3cb" stroke-width="2"/>
  <text x="370" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#15212b">2. Генерация</text>
  <rect x="300" y="96" width="140" height="58" rx="8" fill="#0b3a4a"/>
  <text x="312" y="120" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#e6ebee">$ go generate</text>
  <text x="312" y="142" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#4cc3e0">✓ go-bpm-gen</text>
  <text x="370" y="182" text-anchor="middle" font-size="14" fill="#15212b">типизированный Go-код,</text>
  <text x="370" y="202" text-anchor="middle" font-size="14" fill="#15212b">ошибки — до запуска</text>
  <text x="370" y="222" text-anchor="middle" font-size="12" fill="#6b7680">проверяет компилятор Go</text>

  <path d="M472 140h44" stroke="#6b7680" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 3. Сервис -->
  <rect x="520" y="40" width="200" height="200" rx="14" fill="#e2f2f6" stroke="#0b7896" stroke-width="2"/>
  <text x="620" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#0b7896">3. Ваш сервис</text>
  <rect x="548" y="92" width="144" height="26" rx="5" fill="#fff" stroke="#0b7896"/>
  <text x="620" y="110" text-anchor="middle" font-size="13" fill="#0b7896">ваша бизнес-логика</text>
  <rect x="548" y="122" width="144" height="26" rx="5" fill="#fff" stroke="#0b7896"/>
  <text x="620" y="140" text-anchor="middle" font-size="13" fill="#0b7896">сгенерированный код</text>
  <rect x="548" y="152" width="144" height="26" rx="5" fill="#0b7896"/>
  <text x="620" y="170" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">движок go-bpm</text>
  <text x="620" y="204" text-anchor="middle" font-size="14" fill="#15212b">один бинарник,</text>
  <text x="620" y="224" text-anchor="middle" font-size="14" fill="#15212b">обычный деплой</text>

  <path d="M722 140h44" stroke="#6b7680" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 4. PostgreSQL -->
  <rect x="770" y="40" width="170" height="200" rx="14" fill="#fbefd9" stroke="#e0912f" stroke-width="2"/>
  <text x="855" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#a8650b">4. PostgreSQL</text>
  <ellipse cx="855" cy="102" rx="42" ry="11" fill="#fff" stroke="#e0912f" stroke-width="2"/>
  <path d="M813 102v48c0 6 19 11 42 11s42-5 42-11v-48" fill="#fff" stroke="#e0912f" stroke-width="2"/>
  <path d="M813 126c0 6 19 11 42 11s42-5 42-11" fill="none" stroke="#e0912f" stroke-width="2"/>
  <text x="855" y="188" text-anchor="middle" font-size="14" fill="#15212b">очередь задач,</text>
  <text x="855" y="208" text-anchor="middle" font-size="14" fill="#15212b">экземпляры, история</text>
  <text x="855" y="228" text-anchor="middle" font-size="12" fill="#6b7680">та же база, что у сервиса</text>

  <text x="480" y="280" text-anchor="middle" font-size="14" fill="#6b7680">Схема — исходник. Код из неё собирается, проверяется и выкатывается вместе с сервисом.</text>
</svg>
