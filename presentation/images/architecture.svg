<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7680"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- клиенты -->
  <rect x="20" y="40" width="150" height="56" rx="10" fill="#f2f3ef" stroke="#cfd3cb"/>
  <text x="95" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#15212b">Ваш API</text>
  <text x="95" y="84" text-anchor="middle" font-size="12" fill="#6b7680">StartProcessTx</text>
  <rect x="20" y="118" width="150" height="56" rx="10" fill="#f2f3ef" stroke="#cfd3cb"/>
  <text x="95" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#15212b">Сотрудники</text>
  <text x="95" y="162" text-anchor="middle" font-size="12" fill="#6b7680">задачи через API</text>
  <rect x="20" y="196" width="150" height="56" rx="10" fill="#f2f3ef" stroke="#cfd3cb"/>
  <text x="95" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#15212b">Сопровождение</text>
  <text x="95" y="240" text-anchor="middle" font-size="12" fill="#6b7680">консоль /ui/</text>

  <path d="M172 68h58" stroke="#6b7680" stroke-width="2" marker-end="url(#a)"/>
  <path d="M172 146h58" stroke="#6b7680" stroke-width="2" marker-end="url(#a)"/>
  <path d="M172 224h58" stroke="#6b7680" stroke-width="2" marker-end="url(#a)"/>

  <!-- поды -->
  <g>
    <rect x="236" y="28" width="420" height="250" rx="14" fill="#e2f2f6" stroke="#0b7896" stroke-width="2"/>
    <text x="252" y="54" font-size="15" font-weight="700" fill="#0b7896">Сервис на Go — 1…N экземпляров</text>
    <rect x="252" y="70" width="190" height="88" rx="8" fill="#fff" stroke="#0b7896"/>
    <text x="347" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#0b7896">Системные воркеры</text>
    <text x="347" y="114" text-anchor="middle" font-size="12" fill="#15212b">шаги процесса: методы,</text>
    <text x="347" y="132" text-anchor="middle" font-size="12" fill="#15212b">шлюзы, скрипты, DMN</text>
    <text x="347" y="150" text-anchor="middle" font-size="12" fill="#6b7680">синхронно</text>
    <rect x="452" y="70" width="190" height="88" rx="8" fill="#fff" stroke="#0b7896"/>
    <text x="547" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#0b7896">Воркеры service task</text>
    <text x="547" y="114" text-anchor="middle" font-size="12" fill="#15212b">вызовы внешних систем</text>
    <text x="547" y="132" text-anchor="middle" font-size="12" fill="#15212b">с повторами и паузой</text>
    <text x="547" y="150" text-anchor="middle" font-size="12" fill="#6b7680">асинхронно</text>
    <rect x="252" y="170" width="390" height="40" rx="8" fill="#fff" stroke="#0b7896"/>
    <text x="447" y="195" text-anchor="middle" font-size="13" fill="#15212b">HTTP API · задачи пользователей · консоль с историей</text>
    <rect x="252" y="220" width="390" height="40" rx="8" fill="#0b7896"/>
    <text x="447" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">ваш код: модель данных, сервисы, обработчики</text>
  </g>

  <!-- внешние системы -->
  <rect x="740" y="70" width="200" height="88" rx="10" fill="#f2f3ef" stroke="#cfd3cb"/>
  <text x="840" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#15212b">Внешние системы</text>
  <text x="840" y="124" text-anchor="middle" font-size="12" fill="#6b7680">платежи, почта, АБС,</text>
  <text x="840" y="142" text-anchor="middle" font-size="12" fill="#6b7680">CRM, скоринг…</text>
  <path d="M644 114h94" stroke="#6b7680" stroke-width="2" marker-end="url(#a)"/>

  <!-- база -->
  <rect x="236" y="306" width="704" height="96" rx="14" fill="#fbefd9" stroke="#e0912f" stroke-width="2"/>
  <text x="252" y="332" font-size="15" font-weight="700" fill="#a8650b">PostgreSQL — отдельная база или общая с сервисом</text>
  <rect x="252" y="344" width="160" height="44" rx="7" fill="#fff" stroke="#e0912f"/>
  <text x="332" y="371" text-anchor="middle" font-size="13" fill="#15212b">bpm_queue</text>
  <rect x="422" y="344" width="160" height="44" rx="7" fill="#fff" stroke="#e0912f"/>
  <text x="502" y="371" text-anchor="middle" font-size="13" fill="#15212b">экземпляры</text>
  <rect x="592" y="344" width="160" height="44" rx="7" fill="#fff" stroke="#e0912f"/>
  <text x="672" y="371" text-anchor="middle" font-size="13" fill="#15212b">история и правила</text>
  <rect x="762" y="344" width="164" height="44" rx="7" fill="#fff" stroke="#e0912f" stroke-dasharray="5 4"/>
  <text x="844" y="363" text-anchor="middle" font-size="13" fill="#15212b">ваши таблицы</text>
  <text x="844" y="380" text-anchor="middle" font-size="11" fill="#6b7680">если база общая</text>

  <path d="M447 282v20" stroke="#6b7680" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="462" y="297" font-size="12" fill="#6b7680">шаг процесса + его эффекты = одна транзакция · select … for update skip locked</text>

  <text x="20" y="300" font-size="12" fill="#6b7680">Нет отдельного</text>
  <text x="20" y="318" font-size="12" fill="#6b7680">кластера движка,</text>
  <text x="20" y="336" font-size="12" fill="#6b7680">брокера сообщений</text>
  <text x="20" y="354" font-size="12" fill="#6b7680">и Elasticsearch</text>
</svg>
